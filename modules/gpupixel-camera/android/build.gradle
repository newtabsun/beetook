plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.gpupixelcamera'
version = '0.1.0'
android {
  namespace "expo.modules.gpupixelcamera"
  defaultConfig { versionCode 1; versionName "0.1.0"; minSdkVersion 24 }
}
dependencies {
  // Java API only; the AAR (native .so + assets) is added to :app by plugin/withGpuPixel.js.
  compileOnly files('libs/gpupixel-classes.jar')
  // LiveKit WebRTC (frame-processor API + livekit.org.webrtc); provided at runtime by the app.
  compileOnly project(':livekit_react-native-webrtc')
  implementation 'androidx.core:core-ktx:1.13.1'
}
